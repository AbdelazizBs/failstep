[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "failstep"
version = "0.1.0"
description = "A local CLI that diagnoses why one AI agent run failed."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "failstep contributors" }]
keywords = ["agent", "trace", "cli", "debug", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pydantic>=2.0",
  "rich>=13.0",
  "typer>=0.12",
]

[project.optional-dependencies]
llm = [
  "httpx>=0.27",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/AbdelazizBs/failstep"
Repository = "https://github.com/AbdelazizBs/failstep"

[project.scripts]
failstep = "failstep.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/failstep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/failstep/cli.py" = ["B008"]

